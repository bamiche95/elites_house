name: DevSecOps Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  code-and-secrets-scan:
    name: Secrets, SAST & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST Static Code Analysis (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/owasp-top-ten

      - name: Dependency Vulnerability Scan (Trivy SCA)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  container-and-iac-scan:
    name: Container Hardening & IaC Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Production Docker Image
        run: docker build -t app-security-check:${{ github.sha }} .

      - name: Scan Container Image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: 'app-security-check:${{ github.sha }}'
          severity: 'CRITICAL'
          exit-code: '1'